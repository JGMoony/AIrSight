sonar.projectKey=jgmoony_airsight
sonar.organization=jgmoony
sonar.projectName=AirSight MVP
sonar.projectVersion=1.4.0

sonar.sources=lib
sonar.tests=test

# Exclusiones de archivos autogenerados o configuración sensible
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/firebase_options.dart,build/**,.dart_tool/**,android/**,ios/**,web/**

# Ruta del reporte de cobertura generado por flutter test
sonar.dart.coverage.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
