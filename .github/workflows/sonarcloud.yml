name: SonarCloud Analysis & CI

on:
  push:
    branches:
      - main
      - master
      - 'Iteración_**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: Flutter Test, Coverage & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Clon completo requerido por SonarCloud para análisis de autoría y ramas

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure CI Stubs for Secret Files
        run: |
          mkdir -p lib/config
          if [ ! -f lib/config/api_config.dart ]; then
            cat << 'EOF' > lib/config/api_config.dart
          class ApiConfig {
            ApiConfig._();
            static const String geminiApiKey = String.fromEnvironment('GEMINI_API_KEY', defaultValue: 'CI_STUB_KEY');
            static bool get isGeminiConfigured => geminiApiKey.isNotEmpty && geminiApiKey != 'TU_API_KEY_AQUI';
          }
          EOF
          fi

          if [ ! -f lib/firebase_options.dart ]; then
            cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
              apiKey: 'CI_DUMMY_KEY',
              appId: '1:000000000000:android:0000000000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'airsight-ci-test',
            );
          }
          EOF
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Static Analysis (Lint & Types)
        run: dart analyze lib test

      - name: Run Test Suite with Coverage
        run: flutter test --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Analisis estatico de codigo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
