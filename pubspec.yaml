name: air_sight
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_tts: ^4.0.2
  shared_preferences: ^2.5.3
  http: ^1.2.0
  camera: ^0.11.0+2
  speech_to_text: ^7.0.0
  image: ^4.3.0

  # Para persistencia y roles en la nube (Ley 1581):
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.2
  google_generative_ai: ^0.4.6
  vibration: ^3.1.8
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A" # Color de fondo oscuro de AirSight
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/